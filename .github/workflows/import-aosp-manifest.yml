name: Import canonical AOSP manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Import android-latest-release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone --bare --single-branch --branch android-latest-release \
            https://android.googlesource.com/platform/manifest manifest.git
          git --git-dir=manifest.git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            +refs/heads/android-latest-release:refs/heads/upstream-manifest
