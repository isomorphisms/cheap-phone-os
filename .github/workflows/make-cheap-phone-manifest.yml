name: Make cheap-phone manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  make-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub-hosted manifest branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git clone --single-branch --branch upstream-manifest \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
          cd work
          git switch -c cheap-phone-manifest
          python3 - <<'PY'
          from pathlib import Path
          path = Path("default.xml")
          text = path.read_text()
          old = 'fetch=".."'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one {old!r}, found {text.count(old)}")
          path.write_text(text.replace(old, 'fetch="https://android.googlesource.com/"', 1))
          PY
          git config user.name isomorphisms
          git config user.email isomorphisms@sdf.org
          git add default.xml
          git commit -m "Point AOSP components at canonical Google source"
          git push origin cheap-phone-manifest
